name: Build Desktop Apps (Windows + Mac)

# Manual trigger, or push a version tag (v1.0.0) to also attach installers to a
# GitHub Release. Only touches the desktop/ wrapper — web/Vercel/Firebase are
# unaffected.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write # needed to attach installers to a Release on tag builds

jobs:
  # Build the web app ONCE on Linux, then hand its dist/ to each desktop job.
  # The desktop wrapper ships this snapshot as an offline fallback: normally
  # the installed app loads https://dcpro.online for auto-update parity, but
  # if the network is down at launch it falls back to this bundled copy.
  # --base=./ makes assets load under file:// (relative paths).
  web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web app (relative base for file:// loading)
        run: npx vite build --base=./

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 1

  build:
    needs: web-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: Mac
    runs-on: ${{ matrix.os }}
    steps:
      # Windows 260-char path limit breaks on the deeply-nested committed
      # node_modules (Firebase). Enable long paths for the electron-builder
      # install, and only check out desktop/ so root node_modules is skipped.
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout code (desktop/ only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: desktop
          sparse-checkout-cone-mode: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download web build into desktop/dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: desktop/dist

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      # electron-builder auto-detects the runner OS: windows-latest -> .exe
      # (nsis, x64 + ia32 from package.json), macos-latest -> .dmg. No signing
      # certs, so disable auto-discovery to avoid a signing failure (installers
      # are unsigned by design for now).
      - name: Build installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DCS-Pro-${{ matrix.name }}
          if-no-files-found: warn
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg

      - name: Attach installers to Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.exe
            desktop/release/*.dmg
