name: Deploy Firebase (Functions + Database)

# Push to main -> deploy Cloud Functions + Realtime Database rules.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Node 20 matches functions/package.json "engines": { "node": "20" }.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install functions dependencies
        working-directory: functions
        run: npm install

      - name: Build functions (TypeScript)
        working-directory: functions
        run: npm run build

      # Sync the GitHub repo secret into Firebase Secret Manager so the
      # functions can read process.env.RESEND_API_KEY at runtime.
      - name: Set Resend secret in Firebase
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: printf "%s" "$RESEND_API_KEY" | npx firebase-tools functions:secrets:set RESEND_API_KEY --data-file=- --force --project farmerdb --token "$FIREBASE_TOKEN"

      - name: Deploy to Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx firebase-tools deploy --only functions,database --token "$FIREBASE_TOKEN" --project farmerdb --non-interactive --force
