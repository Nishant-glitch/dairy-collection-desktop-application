<!doctype html>
<!-- Shown by the Android app (capacitor.config.ts server.errorPath) only when
     https://dcpro.online fails to load AND no service-worker cache exists yet —
     i.e. the very first launch without internet. After one online launch the
     service worker serves the app offline and this page is never reached.
     No Capacitor plugins are available here. -->
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DCS Pro — Internet chahiye</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
             background: #F4F7F5; color: #0a0a0a; padding: 24px; box-sizing: border-box;
             font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
      .card { max-width: 420px; background: #fff; border: 1px solid #E6ECE8; border-radius: 16px;
              padding: 28px 24px; text-align: center; box-shadow: 0 18px 48px rgba(16,40,28,0.12); }
      .icon { font-size: 44px; margin-bottom: 10px; }
      h1 { font-size: 21px; margin: 0 0 10px; }
      p { font-size: 16px; line-height: 1.6; color: #374151; margin: 0 0 8px; }
      button { margin-top: 18px; width: 100%; min-height: 52px; border: none; border-radius: 12px;
               background: #18A558; color: #fff; font-size: 17px; font-weight: 800; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">📶</div>
      <h1>Internet chahiye</h1>
      <p>DCS Pro pehli baar kholne ke liye internet zaroori hai.</p>
      <p>Ek baar khul jaane ke baad app bina internet ke bhi chalegi — entries phone mein save hongi aur internet aane par sync hongi.</p>
      <p style="font-size:14px;color:#4b5563">First launch needs internet. After that the app works offline.</p>
      <button onclick="location.href='https://dcpro.online/'">Dobara try karein / Retry</button>
    </div>
  </body>
</html>
